name: ProgramForge
options:
  bundleIdPrefix: com.nj24k
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
attributes: {}
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
targets:
  ProgramForge:
    type: application
    platform: iOS
    sources:
      - ProgramForge
    info:
      path: ProgramForge/Info.plist
      properties:
        CFBundleDisplayName: ProgramForge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: ProgramForge reads workouts you choose to export to Apple Health.
        NSHealthUpdateUsageDescription: ProgramForge can save your logged workouts to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nj24k.programforge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ProgramForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ProgramForgeTests
    dependencies:
      - target: ProgramForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nj24k.programforge.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ProgramForge:
    build:
      targets:
        ProgramForge: all
        ProgramForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ProgramForgeTests
